name: Feature Proposal
description: Propose a new feature, visualization, or tool for the Aivora platform.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      placeholder: What problem or gap does this feature address?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      placeholder: Describe how this should work.
    validations:
      required: true
