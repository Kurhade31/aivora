name: Content Validation

on:
  pull_request:
    paths:
      - 'src/data/**'
      - 'scripts/validate-content.mjs'

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run validation script
        run: node scripts/validate-content.mjs
