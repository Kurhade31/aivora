<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="app-orbit-1" x1="50" y1="50" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="app-glow" cx="256" cy="256" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="4" />
  <circle cx="256" cy="256" r="210" stroke="#1E293B" stroke-width="2" stroke-dasharray="12 16" opacity="0.4" />
  
  <!-- Outer Orbits -->
  <ellipse cx="256" cy="256" rx="200" ry="80" transform="rotate(-30 256 256)" stroke="url(#app-orbit-1)" stroke-width="14" fill="none" stroke-linecap="round" />
  <ellipse cx="256" cy="256" rx="200" ry="80" transform="rotate(35 256 256)" stroke="#06B6D4" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.8" />
  
  <!-- Core Glow -->
  <circle cx="256" cy="256" r="120" fill="url(#app-glow)" />
  
  <!-- Central Knowledge Core -->
  <polygon points="256,170 330,213 330,299 256,342 182,299 182,213" fill="#0F172A" stroke="#38BDF8" stroke-width="12" />
  <circle cx="256" cy="256" r="32" fill="#38BDF8" />
  
  <!-- Satellite Nodes -->
  <circle cx="430" cy="150" r="18" fill="#10B981" />
  <circle cx="80" cy="360" r="15" fill="#06B6D4" />
</svg>
