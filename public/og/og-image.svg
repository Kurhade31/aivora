<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#04070E" />
    </linearGradient>
    <linearGradient id="og-orbit-1" x1="200" y1="100" x2="1000" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="og-glow" cx="950" cy="315" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)" />

  <!-- Background Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="320" y1="0" x2="320" y2="630" />
    <line x1="560" y1="0" x2="560" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1040" y1="0" x2="1040" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="510" x2="1200" y2="510" />
  </g>

  <!-- Ambient Glow in Orbit Zone -->
  <circle cx="950" cy="315" r="280" fill="url(#og-glow)" />

  <!-- Orbital Geometry on Right Side -->
  <g transform="translate(950, 315)">
    <circle cx="0" cy="0" r="220" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 12" />
    <ellipse cx="0" cy="0" rx="210" ry="85" transform="rotate(-30)" stroke="url(#og-orbit-1)" stroke-width="6" fill="none" />
    <ellipse cx="0" cy="0" rx="210" ry="85" transform="rotate(35)" stroke="#06B6D4" stroke-width="4" fill="none" opacity="0.8" />
    <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
    <circle cx="0" cy="0" r="16" fill="#38BDF8" />
    <circle cx="170" cy="-60" r="9" fill="#10B981" />
    <circle cx="-160" cy="70" r="8" fill="#06B6D4" />
  </g>

  <!-- Left Content -->
  <!-- Badge -->
  <rect x="80" y="90" width="230" height="34" rx="17" fill="#0E2135" stroke="#06B6D4" stroke-width="1.5" />
  <circle cx="98" cy="107" r="4" fill="#10B981" />
  <text x="112" y="112" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">KNOWLEDGE OS FOR AI</text>

  <!-- Title AIVORA -->
  <text x="80" y="220" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="78" font-weight="900" letter-spacing="-1">AIVORA</text>

  <!-- Tagline -->
  <text x="80" y="280" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Understand AI. Navigate the AI era. Build what's next.</text>

  <!-- Subtitle -->
  <text x="80" y="340" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
    An open knowledge platform for understanding artificial intelligence,
  </text>
  <text x="80" y="375" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
    exploring the technologies behind it, and turning knowledge into real-world systems.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 450)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="42" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="20" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">AI MAP</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="150" height="42" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="165" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">MODELS & TOOLS</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="155" height="42" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="330" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">FIND YOUR STACK</text>

    <!-- Pill 4 -->
    <rect x="480" y="0" width="150" height="42" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="500" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">PROJECT LAB</text>

    <!-- Pill 5 -->
    <rect x="645" y="0" width="140" height="42" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="665" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">AI SAFETY</text>
  </g>

  <!-- Footer bar -->
  <text x="80" y="555" fill="#64748B" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
    Open Source • Factual &amp; Verified • No Marketing Fluff • Free Forever
  </text>
</svg>
